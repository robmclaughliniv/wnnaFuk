# Static content deploy for wnnafuk — no Terraform here.
# Infra is provisioned once via scripts/bootstrap.sh; this workflow only builds
# and ships content, authenticating to AWS via OIDC (no long-lived keys).
#
# Required repo variables (set by bootstrap.sh):
#   AWS_DEPLOY_ROLE_ARN, AWS_REGION, S3_BUCKET, CLOUDFRONT_DISTRIBUTION_ID

name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.9"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: wnnafuk-deploy

      # Pass 1: hashed assets first — immutable, no --delete
      - name: Sync hashed assets to S3
        run: |
          aws s3 sync out/ "s3://${{ vars.S3_BUCKET }}/" \
            --exclude "*" \
            --include "_next/static/*" \
            --cache-control "public,max-age=31536000,immutable"

      # Pass 2: everything else — no-cache, --delete only here
      - name: Sync HTML and SW to S3
        run: |
          aws s3 sync out/ "s3://${{ vars.S3_BUCKET }}/" \
            --exclude "_next/static/*" \
            --delete \
            --cache-control "no-cache,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
